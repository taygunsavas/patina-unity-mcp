name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  csharp-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool restore
      - run: dotnet restore tools/Patina.CSharpStyleCheck.Tests/Patina.CSharpStyleCheck.Tests.csproj
      - run: dotnet test tools/Patina.CSharpStyleCheck.Tests/Patina.CSharpStyleCheck.Tests.csproj --configuration Release --no-restore
      - shell: pwsh
        run: ./scripts/check-csharp-format.ps1 -BaseRef "${{ github.event.pull_request.base.sha || github.event.before }}"
      - shell: pwsh
        run: ./scripts/check-csharp-style.ps1 -BaseRef "${{ github.event.pull_request.base.sha || github.event.before }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version sync
        shell: pwsh
        run: ./scripts/assert-version-sync.ps1

      - name: Validate package layout
        shell: pwsh
        run: |
          $required = @(
            "unity-package/package.json",
            "unity-package/Editor/Patina.Editor.asmdef",
            "unity-package/Plugins/x86_64-win/.gitkeep",
            "unity-package/Plugins/x86_64-linux/.gitkeep",
            "unity-package/Plugins/x86_64-macos/.gitkeep",
            "unity-package/Plugins/aarch64-macos/.gitkeep"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required package path: $path"
            }
          }
          Write-Host "Package layout OK."

      - name: Validate Unity metadata
        shell: pwsh
        run: |
          $missing = @()
          Get-ChildItem -Path "unity-package/Editor" -Recurse -File -Include "*.cs", "*.asmdef" | ForEach-Object {
            $metaPath = "$($_.FullName).meta"
            if (-not (Test-Path $metaPath)) {
              $missing += $_.FullName
            }
          }

          if ($missing.Count -gt 0) {
            $relative = $missing | ForEach-Object { Resolve-Path $_ -Relative }
            throw "Missing Unity metadata files for: $($relative -join ', ')"
          }

          Write-Host "Unity metadata OK."

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server

      - name: Cargo fmt check
        working-directory: rust-server
        run: cargo fmt --check

      - name: Cargo test
        working-directory: rust-server
        run: cargo test

      - name: Cargo clippy
        working-directory: rust-server
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check (release)
        working-directory: rust-server
        run: cargo check --release
