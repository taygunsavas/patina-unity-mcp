name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify version sync
        shell: pwsh
        run: ./scripts/assert-version-sync.ps1 -Tag "${{ github.ref_name }}"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$') {
            throw "Release tag must be SemVer formatted, for example v1.2.3 or v1.2.3-beta.1."
          }

          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

  generate-changelog:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag }}

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG='${{ needs.verify.outputs.tag }}'
          VERSION='${{ needs.verify.outputs.version }}'

          if [[ ! "$CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Release version must be SemVer formatted, for example v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$CURRENT_TAG" >/dev/null; then
            echo "Tag $CURRENT_TAG does not exist in the repository."
            exit 1
          fi

          PREVIOUS_TAG=$(git tag --sort=version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | awk -v current="$CURRENT_TAG" '$0 == current { print previous; found=1; exit } { previous=$0 } END { if (!found) exit 1 }' || true)
          DATE_UTC=$(date -u '+%Y-%m-%d')

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE=""
            RANGE_NOTE="Full commit history for the first tagged release."
            COMPARE_NOTE="No previous SemVer tag was found."
          else
            RANGE="$PREVIOUS_TAG..$CURRENT_TAG"
            RANGE_NOTE="Changes since $PREVIOUS_TAG."
            COMPARE_NOTE="[Compare $PREVIOUS_TAG...$CURRENT_TAG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG})"
          fi

          rm -rf changelog-sections
          mkdir -p changelog-sections
          for section in highlights breaking features fixes performance refactoring documentation tests build ci dependencies chores style other; do
            : > "changelog-sections/$section.md"
          done

          clean_subject() {
            local subject="$1"
            subject=$(echo "$subject" | sed -E 's/^(feat|fix|perf|refactor|docs|test|tests|build|ci|chore|style)(\([^)]+\))?!?:[[:space:]]*//')
            echo "$subject" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g'
          }

          classify_subject() {
            local subject="$1"
            local deps_re='^build\(deps\):'
            local bump_re='[Bb]ump[[:space:]]'
            local feat_re='^feat(\([^)]+\))?!?:'
            local fix_re='^fix(\([^)]+\))?!?:'
            local perf_re='^perf(\([^)]+\))?!?:'
            local refactor_re='^refactor(\([^)]+\))?!?:'
            local docs_re='^docs(\([^)]+\))?!?:'
            local tests_re='^test(s)?(\([^)]+\))?!?:'
            local build_re='^build(\([^)]+\))?!?:'
            local ci_re='^ci(\([^)]+\))?!?:'
            local chore_re='^chore(\([^)]+\))?!?:'
            local style_re='^style(\([^)]+\))?!?:'

            if [[ "$subject" =~ $deps_re ]] || [[ "$subject" =~ $bump_re ]]; then
              echo "dependencies"
            elif [[ "$subject" =~ $feat_re ]]; then
              echo "features"
            elif [[ "$subject" =~ $fix_re ]]; then
              echo "fixes"
            elif [[ "$subject" =~ $perf_re ]]; then
              echo "performance"
            elif [[ "$subject" =~ $refactor_re ]]; then
              echo "refactoring"
            elif [[ "$subject" =~ $docs_re ]]; then
              echo "documentation"
            elif [[ "$subject" =~ $tests_re ]]; then
              echo "tests"
            elif [[ "$subject" =~ $build_re ]]; then
              echo "build"
            elif [[ "$subject" =~ $ci_re ]]; then
              echo "ci"
            elif [[ "$subject" =~ $chore_re ]]; then
              echo "chores"
            elif [[ "$subject" =~ $style_re ]]; then
              echo "style"
            else
              echo "other"
            fi
          }

          append_commit() {
            local sha="$1"
            local subject="$2"
            local author="$3"
            local section
            local cleaned
            local short_sha
            local commit_url
            local pr_number
            local pr_text=""

            section=$(classify_subject "$subject")
            cleaned=$(clean_subject "$subject")
            short_sha=$(git rev-parse --short "$sha")
            commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}"

            if [[ "$subject" =~ \(\#([0-9]+)\)$ ]]; then
              pr_number="${BASH_REMATCH[1]}"
              pr_text=", [#${pr_number}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${pr_number})"
              cleaned=$(echo "$cleaned" | sed -E 's/[[:space:]]*\(#[0-9]+\)$//')
            fi

            line="- ${cleaned} ([${short_sha}](${commit_url})${pr_text}, ${author})"
            echo "$line" >> "changelog-sections/$section.md"

            if [[ "$section" == "features" || "$section" == "fixes" ]]; then
              echo "$line" >> changelog-sections/highlights.md
            fi

            local breaking_subject_re='^[a-z]+(\([^)]+\))?!:'
            if [[ "$subject" =~ $breaking_subject_re ]] || git show -s --format=%B "$sha" | grep -qi '^BREAKING CHANGE:'; then
              echo "$line" >> changelog-sections/breaking.md
            fi
          }

          git log $RANGE --no-merges --pretty=$'%H\t%s\t%an' | while IFS=$'\t' read -r sha subject author; do
            [ -z "$sha" ] && continue
            append_commit "$sha" "$subject" "$author"
          done

          {
            echo "# Patina $CURRENT_TAG"
            echo
            echo "**Release date (UTC):** $DATE_UTC"
            echo
            echo "$RANGE_NOTE"
            echo
            echo "$COMPARE_NOTE"
            echo
            echo "## Artifact Notes"
            echo
            echo "- Primary install path: scoped registry package publication."
            echo "- GitHub Releases are the secondary download channel."
            echo "- Unity package version: \`$VERSION\`."
            echo "- Included release assets: npm-compatible UPM tarball, zipped Unity package, and Windows/Linux/macOS Patina server binaries."
            echo "- Recommended Unity baseline for signed-package reliability: 6000.3.5f2 or newer."
            echo

            section() {
              local title="$1"
              local file="$2"
              if [ -s "$file" ]; then
                echo "## $title"
                echo
                cat "$file"
                echo
              fi
            }

            section "Highlights" changelog-sections/highlights.md
            section "Breaking Changes" changelog-sections/breaking.md
            section "Features" changelog-sections/features.md
            section "Fixes" changelog-sections/fixes.md
            section "Performance" changelog-sections/performance.md
            section "Refactoring" changelog-sections/refactoring.md
            section "Documentation" changelog-sections/documentation.md
            section "Tests" changelog-sections/tests.md
            section "Build System" changelog-sections/build.md
            section "CI" changelog-sections/ci.md
            section "Dependencies" changelog-sections/dependencies.md
            section "Chores" changelog-sections/chores.md
            section "Style" changelog-sections/style.md
            section "Other Changes" changelog-sections/other.md

            if ! grep -q '^- ' changelog-sections/*.md; then
              echo "## Changes"
              echo
              echo "_No commit changes detected for this release range._"
              echo
            fi

            echo "---"
            echo
            echo "_Generated automatically by GitHub Actions._"
          } > CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-changelog
          path: CHANGELOG.md
          if-no-files-found: error

  build-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: patina-server-x86_64-win
            output-name: patina-server.exe
            binary-path: rust-server/target/x86_64-pc-windows-msvc/release/patina-server.exe
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: patina-server-x86_64-linux
            output-name: patina-server
            binary-path: rust-server/target/x86_64-unknown-linux-gnu/release/patina-server

          - os: macos-14
            rust-target: aarch64-apple-darwin
            artifact-name: patina-server-aarch64-macos
            output-name: patina-server
            binary-path: rust-server/target/aarch64-apple-darwin/release/patina-server
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server

      - name: Build release binary
        working-directory: rust-server
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Verify runtime command catalog
        shell: pwsh
        run: ./scripts/check-active-tools.ps1 -BinaryPath "${{ matrix.binary-path }}" -Port 9800

      - name: Stage binary artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.binary-path }}" "dist/${{ matrix.output-name }}" -Force

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.output-name }}
          if-no-files-found: error

  package-upm:
    needs:
      - verify
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage distributable Unity package
        shell: pwsh
        run: |
          ./scripts/stage-upm-package.ps1 `
            -SourcePackagePath "unity-package" `
            -ArtifactsPath "artifacts" `
            -OutputPath "dist/unity-package" `
            -Version "${{ needs.verify.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Pack npm-compatible tarball
        shell: pwsh
        run: |
          npm pack ./dist/unity-package --pack-destination dist

      - name: Archive Unity package bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/unity-package/*" -DestinationPath "dist/patina-upm-${{ needs.verify.outputs.version }}.zip"

      - name: Upload staged Unity package
        uses: actions/upload-artifact@v7
        with:
          name: patina-unity-package
          path: dist/unity-package
          if-no-files-found: error

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: patina-release-bundles
          path: |
            dist/*.tgz
            dist/patina-upm-${{ needs.verify.outputs.version }}.zip
          if-no-files-found: error

  publish-npm:
    needs:
      - verify
      - package-upm
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL }}
    steps:
      - name: Check npm publish prerequisites
        id: preflight
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NPM_TOKEN)) {
            Write-Host "::notice title=npm publish skipped::NPM_TOKEN is not configured."
            "should_publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "should_publish=true" >> $env:GITHUB_OUTPUT

      - name: Download release bundles
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: patina-release-bundles
          path: dist

      - name: Setup Node.js
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Publish package to npm-compatible registry
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          $registryUrl = $env:NPM_REGISTRY_URL
          if ([string]::IsNullOrWhiteSpace($registryUrl)) {
            $registryUrl = "https://registry.npmjs.org/"
          }

          $tarball = Get-ChildItem dist -Filter *.tgz | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tarball) {
            throw "Could not find packaged tarball to publish."
          }

          $registryUri = [Uri]$registryUrl
          $registryPath = $registryUri.AbsolutePath.TrimEnd("/")
          $registryTokenKey = if ([string]::IsNullOrWhiteSpace($registryPath) -or $registryPath -eq "/") {
            "//{0}/:_authToken" -f $registryUri.Authority
          } else {
            "//{0}{1}/:_authToken" -f $registryUri.Authority, $registryPath + "/"
          }

          $tempNpmrc = Join-Path $env:RUNNER_TEMP "patina-npmrc"
          @(
            "registry=$registryUrl"
            "$registryTokenKey=$env:NPM_TOKEN"
            "always-auth=true"
          ) | Set-Content -Path $tempNpmrc -Encoding ascii

          $env:NPM_CONFIG_USERCONFIG = $tempNpmrc
          npm publish $tarball --access public --registry $registryUrl

  publish-openupm:
    needs:
      - verify
      - package-upm
    runs-on: ubuntu-latest
    env:
      OPENUPM_TOKEN: ${{ secrets.OPENUPM_TOKEN }}
      OPENUPM_REGISTRY_URL: ${{ vars.OPENUPM_REGISTRY_URL }}
    steps:
      - name: Check OpenUPM publish prerequisites
        id: preflight
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENUPM_TOKEN)) {
            Write-Host "::notice title=OpenUPM publish skipped::OPENUPM_TOKEN is not configured."
            "should_publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:OPENUPM_REGISTRY_URL)) {
            Write-Host "::notice title=OpenUPM publish skipped::OPENUPM_REGISTRY_URL is not configured."
            "should_publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "should_publish=true" >> $env:GITHUB_OUTPUT

      - name: Download release bundles
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: patina-release-bundles
          path: dist

      - name: Setup Node.js
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Publish package to OpenUPM-compatible registry
        if: ${{ steps.preflight.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          $tarball = Get-ChildItem dist -Filter *.tgz | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tarball) {
            throw "Could not find packaged tarball to publish."
          }

          $registryUri = [Uri]$env:OPENUPM_REGISTRY_URL
          $registryPath = $registryUri.AbsolutePath.TrimEnd("/")
          $registryTokenKey = if ([string]::IsNullOrWhiteSpace($registryPath) -or $registryPath -eq "/") {
            "//{0}/:_authToken" -f $registryUri.Authority
          } else {
            "//{0}{1}/:_authToken" -f $registryUri.Authority, $registryPath + "/"
          }

          $tempNpmrc = Join-Path $env:RUNNER_TEMP "patina-openupm-npmrc"
          @(
            "registry=$env:OPENUPM_REGISTRY_URL"
            "$registryTokenKey=$env:OPENUPM_TOKEN"
            "always-auth=true"
          ) | Set-Content -Path $tempNpmrc -Encoding ascii

          $env:NPM_CONFIG_USERCONFIG = $tempNpmrc
          npm publish $tarball --access public --registry $env:OPENUPM_REGISTRY_URL

  github-release:
    needs:
      - verify
      - build-binaries
      - generate-changelog
      - package-upm
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download release bundles
        uses: actions/download-artifact@v8
        with:
          name: patina-release-bundles
          path: dist

      - name: Download release changelog
        uses: actions/download-artifact@v8
        with:
          name: release-changelog
          path: .

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            CHANGELOG.md
            dist/*.tgz
            dist/*.zip
            artifacts/patina-server-x86_64-win/patina-server.exe
            artifacts/patina-server-x86_64-linux/patina-server
            artifacts/patina-server-aarch64-macos/patina-server
