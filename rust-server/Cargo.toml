[package]
name = "patina-server"
version = "1.1.14"
edition = "2021"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
anyhow = "1"
